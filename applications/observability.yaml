apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devopscanvas-observability
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DevOpsCanvasIO/devopscanvas-observability
    targetRevision: main
    path: infra/helm/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true