apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devopscanvas-portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DevOpsCanvasIO/devopscanvas-portal
    targetRevision: main
    path: infra/helm/devopscanvas-portal
  destination:
    server: https://kubernetes.default.svc
    namespace: devopscanvas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true