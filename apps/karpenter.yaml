apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-provisioners
  namespace: argocd
spec:
  destination:
    namespace: karpenter
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/DevOpsCanvasIO/devopscanvas-gitops
    targetRevision: main
    path: manifests/karpenter
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
